name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: npm run check
      - name: Unit + headless Chrome tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm test
      - name: Package
        run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: custom-gmail-tabs
          path: dist/custom-gmail-tabs.zip
